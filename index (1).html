<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Delhi within 200 km: cities, NCR districts, ring roads, highways, mandis and LCV entry routes.">
<style>
/* baseline the artifact host used to supply */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Delhi 200 km Radius</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Two views on one canvas: 200 km region sheet and a 26 km ring-road sheet. Survey-sheet palette. */
:root{
  --bg:#FFFFFF; --surface:#FBFBF8; --surface-2:#F2F3EE;
  --ink:#1C2119; --ink-2:#585E53; --ink-3:#8C927F;
  --rule:#DCDFD2; --rule-soft:#E8EADF;
  --accent:#A33B2A;
  --road:#FFFFFF; --expressway:#E3A712; --nh-case:#5A6054; --ringroad:#CC1F1F; --water:#4E7A8A; --lcv:#2E8B2E;
  --c-ncr:#2F5880; --c-town:#6B7164; --c-mandi:#1F7A4D; --c-transit:#6A3FA0; --c-ev:#0C7A84;
  --shadow:0 1px 2px rgba(34,40,31,.14), 0 6px 18px rgba(34,40,31,.08);
  --fd:"Eczar",Georgia,serif;
  --fc:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
  --fb:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12160F; --surface:#1A1F17; --surface-2:#232A1F;
  --ink:#E2E6D8; --ink-2:#A2A995; --ink-3:#767D6A;
  --rule:#333A2C; --rule-soft:#2A3024;
  --accent:#E07A5F;
  --road:#FFFFFF; --expressway:#F5C33C; --nh-case:#0B0E08; --ringroad:#FF5B4A; --water:#6FA3B5; --lcv:#5FD45F;
  --c-ncr:#86B2DE; --c-town:#A8AF9A; --c-mandi:#52C08A; --c-transit:#BB94E8; --c-ev:#45CFDC;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1A1F17; --surface-2:#232A1F;
  --ink:#E2E6D8; --ink-2:#A2A995; --ink-3:#767D6A;
  --rule:#333A2C; --rule-soft:#2A3024;
  --accent:#E07A5F;
  --road:#FFFFFF; --expressway:#F5C33C; --nh-case:#0B0E08; --ringroad:#FF5B4A; --water:#6FA3B5; --lcv:#5FD45F;
  --c-ncr:#86B2DE; --c-town:#A8AF9A; --c-mandi:#52C08A; --c-transit:#BB94E8; --c-ev:#45CFDC;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;margin:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.shell{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}

/* ---- header ---- */
.top{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);background:var(--surface);
  position:relative;z-index:6;
}
.top h1{font-family:var(--fd);font-weight:700;font-size:21px;line-height:1.1;margin:0;letter-spacing:-.01em}
.top h1 em{font-style:normal;color:var(--accent)}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--bg)}
.seg button{font-family:var(--fc);font-size:11.5px;letter-spacing:.05em;padding:5px 11px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.top .sub{font-family:var(--fc);font-size:12px;color:var(--ink-2);letter-spacing:.02em;flex:1 1 180px;min-width:0}
.themebtn{font-family:var(--fc);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:2px;padding:4px 8px}
.themebtn:hover{color:var(--ink);border-color:var(--ink-3)}

.main{display:grid;grid-template-columns:1fr 352px;min-height:0}

/* ---- map ---- */
.mapwrap{position:relative;min-width:0;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ring{fill:none;stroke:var(--accent);stroke-opacity:.3;stroke-width:1.1}
.ring.major{stroke-opacity:.7;stroke-width:1.7}
.ring.faint{stroke-opacity:.15;stroke-dasharray:4 5}
.spoke{stroke:var(--ink-3);stroke-opacity:.24;stroke-width:.7;stroke-dasharray:2 7}
.ringlab{font-family:var(--fc);font-size:14px;font-weight:600;fill:var(--accent);letter-spacing:.06em}
.compass{font-family:var(--fc);font-size:14px;font-weight:600;fill:var(--ink-3);letter-spacing:.14em}
.statelab{font-family:var(--fc);font-size:14px;font-weight:600;fill:var(--ink-3);letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.road{fill:none;stroke:var(--road);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.road.exp{stroke-width:2.1;stroke:var(--expressway)}
.road.case{stroke:var(--nh-case);stroke-width:3.1;opacity:.95}
.road.case.exp{stroke-width:3.7}
.roadlab{font-family:var(--fc);font-size:9.5px;font-weight:600;fill:var(--road);letter-spacing:.08em;
  stroke:var(--nh-case);stroke-width:1.9px;stroke-linejoin:round;paint-order:stroke fill}
.roadlab.exp{fill:var(--expressway)}
.lcv{fill:none;stroke:var(--lcv);stroke-width:8;opacity:.2;stroke-linecap:round;stroke-linejoin:round}
.lcvline{fill:none;stroke:var(--lcv);stroke-width:1.5;stroke-dasharray:7 5;opacity:.95;stroke-linecap:round;marker-end:url(#lcvarrow)}
.lcvlab{font-family:var(--fc);font-size:10px;font-weight:600;fill:var(--lcv);letter-spacing:.09em;text-transform:uppercase}
.river{fill:none;stroke:var(--water);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.rring{fill:none;stroke:var(--ringroad);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;opacity:1}
.rring.dash{stroke-dasharray:5 3.5;stroke-width:1.1;opacity:.85}
.rring.big{stroke-width:2.2}
.rring.big.dash{stroke-width:1.7}
.rringlab{font-family:var(--fc);font-size:12px;font-weight:600;fill:var(--ringroad);letter-spacing:.09em}
.rringlab.big{font-size:14px;letter-spacing:.14em;text-transform:uppercase}
#g-ringroads[data-z="far"] .rringlab{display:none}
.hairline{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:5 4;opacity:.95}
.lyr-off,.view-off{display:none}

/* ---- overlay markers ---- */
.layer{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.mk .glyph{display:block;width:19px;height:19px;transition:transform .12s ease}
.mk.star .glyph{width:26px;height:26px}
.mk:hover .glyph,.mk.sel .glyph{transform:scale(1.3)}
.mk.dim{opacity:.17;pointer-events:none}
.mk.hide{display:none}
.mk.soft{opacity:.18}
.mk.soft:hover{opacity:1}
.lab.soft{opacity:.3;font-weight:400}
.lab.star{font-weight:700;color:var(--ink);font-size:14px}
.mk.sel{z-index:5}
.lab{
  position:absolute;pointer-events:none;font-family:var(--fc);font-size:14px;font-weight:500;
  color:var(--ink);white-space:nowrap;z-index:3;letter-spacing:.01em;
  text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 5px var(--bg),0 0 7px var(--bg);
}
.lab.hi{font-weight:700;color:var(--accent);font-size:14px;z-index:6}
.lab.dim{display:none}
.hub{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:auto;cursor:pointer}
.hub.sm .dot{width:7px;height:7px;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.hub.sm .nm{margin-top:-16px;font-size:14px}
.hub .dot{width:15px;height:15px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg),0 0 0 4.4px var(--accent)}
.hub.az .dot{width:17px;height:17px;border-radius:3px;transform:rotate(45deg);background:var(--c-mandi);
  box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c-mandi),0 0 0 11px color-mix(in srgb,var(--c-mandi) 22%,transparent)}
.hub.az .nm{color:var(--c-mandi);margin-top:-26px;letter-spacing:.04em}
.hub .nm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap;margin-top:-20px;text-shadow:0 0 4px var(--bg),0 0 8px var(--bg)}

/* ---- map chrome ---- */
.chrome{position:absolute;display:flex;flex-direction:column;gap:6px;z-index:7}
.chrome.tl{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px))}
.chrome.br{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));align-items:flex-end}
.zoomgrp{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.zoomgrp button{width:30px;height:28px;font-size:15px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.zoomgrp button+button{border-top:1px solid var(--rule)}
.zoomgrp button:hover{background:var(--surface-2);color:var(--ink)}
.zoomgrp button.wide{width:auto;padding:0 9px;font-family:var(--fc);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.layers{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}
.layers b{font-family:var(--fc);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.layers label{display:flex;align-items:center;gap:6px;font-family:var(--fc);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.layers input{accent-color:var(--accent);width:12px;height:12px;margin:0}
.swatch{width:14px;height:2.5px;background:var(--ringroad);display:inline-block;border-radius:2px}
.scalebar{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:5px 8px 6px;box-shadow:var(--shadow);font-family:var(--fc);font-size:10px;color:var(--ink-2);letter-spacing:.05em}
.scalebar .bar{height:5px;border:1px solid var(--ink-3);border-top:0;margin-top:3px}

/* ---- panel ---- */
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--rule);background:var(--surface)}
.pad{padding-left:14px;padding-right:14px}
.searchrow{display:flex;gap:7px;padding-block:11px 9px;border-bottom:1px solid var(--rule-soft)}
.searchrow input{flex:1;min-width:0;font-family:var(--fc);font-size:15px;padding:6px 9px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:2px}
.searchrow input::placeholder{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding-block:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--fc);font-size:12.5px;letter-spacing:.03em;padding:3.5px 8px;border:1px solid var(--rule);border-radius:999px;color:var(--ink-2);background:var(--bg)}
.chip svg{flex:none}
.chip.on{border-color:currentColor;background:var(--surface-2);color:var(--ink)}
.chip.off{opacity:.42}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:10px}
.ringrow{display:flex;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--rule-soft)}
.ringrow button{flex:1;font-family:var(--fc);font-size:12px;letter-spacing:.04em;padding:4px 2px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2);background:var(--bg);font-variant-numeric:tabular-nums}
.ringrow button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .ringrow button.on,:root:not([data-theme="light"]) .ringrow button.on{color:#15190F}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .ringrow button.on{color:#fff}}

.list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.grp{font-family:var(--fc);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:13px 14px 5px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule-soft)}
.row{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;width:100%;text-align:left;padding:6px 14px;border-bottom:1px solid var(--rule-soft)}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.row .nm{font-family:var(--fc);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--ink-3);font-size:12.5px;letter-spacing:.06em;margin-left:5px}
.row .km{font-family:var(--fc);font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .km b{color:var(--ink);font-weight:600}
.empty{padding:26px 14px;color:var(--ink-3);font-size:13px;text-align:center}

/* ---- detail ---- */
.detail{border-top:1px solid var(--rule);background:var(--surface-2);padding-block:12px 14px;max-height:47%;overflow-y:auto}
.detail .kicker{font-family:var(--fc);font-size:9.5px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.detail h2{font-family:var(--fd);font-weight:700;font-size:23px;line-height:1.15;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.facts{display:flex;gap:16px;margin:9px 0 0;padding:8px 0;border-block:1px solid var(--rule);flex-wrap:wrap}
.fact{min-width:0}
.fact dt{font-family:var(--fc);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
.fact dd{margin:1px 0 0;font-family:var(--fc);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.fact dd.ring{color:var(--ringroad)}
.detail p{margin:9px 0 0;font-size:14px;line-height:1.6;color:var(--ink-2);max-width:60ch}
.detail .hint{margin-top:10px;font-family:var(--fc);font-size:11.5px;color:var(--ink-3)}
.closebtn{margin-left:auto;font-family:var(--fc);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.closebtn:hover{color:var(--accent)}

@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,auto)}
  .mapwrap{min-height:44vh}
  .panel{border-left:0;border-top:1px solid var(--rule);max-height:52vh}
  .list{max-height:28vh}
  .detail{max-height:none}
  .top h1{font-size:19px}
  .top .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Delhi <em id="h1scale">200&nbsp;km</em></h1>
    <div class="seg" id="seg">
      <button data-v="region" class="on">Region</button>
      <button data-v="delhi">Ring roads</button>
    </div>
    <div class="sub" id="subtitle">Cities, towns and NCR districts inside a 200 km circle.</div>
    <button class="themebtn" id="theme">Theme</button>
  </header>

  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="Map of Delhi and its surroundings">
        <defs>
          <marker id="lcvarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
            <path d="M0 0 10 5 0 10Z" fill="var(--lcv)"/>
          </marker>
        </defs>
        <g id="zoom">
          <g id="v-region">
            <g id="g-roads"></g>
            <g id="g-ringroads"></g>
            <g id="g-rings"></g>
            <g id="g-states"></g>
          </g>
          <g id="v-delhi" class="view-off">
            <g id="d-river"></g>
            <g id="d-lcv"></g>
            <g id="d-roads"></g>
            <g id="d-ringroads"></g>
            <g id="d-rings"></g>
          </g>
          <g id="g-sel"></g>
        </g>
      </svg>
      <div class="layer" id="layer"></div>

      <div class="chrome tl">
        <div class="layers">
          <b>Layers</b>
          <label><input type="checkbox" id="l-rings" checked> Distance rings</label>
          <label><input type="checkbox" id="l-roads" checked> National highways</label>
          <label><input type="checkbox" id="l-ringroads" checked> Ring roads <span class="swatch"></span></label>
          <label><input type="checkbox" id="l-lcv" checked> LCV entry routes <span class="swatch" style="background:var(--lcv)"></span></label>
          <label><input type="checkbox" id="l-states" checked> State names</label>
          <label><input type="checkbox" id="l-labels" checked> Place names</label>
          <label><input type="checkbox" id="l-focus" checked> Dim everything else</label>
        </div>
      </div>

      <div class="chrome br">
        <div class="zoomgrp">
          <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zreset" class="wide" title="Reset view">Fit</button>
        </div>
        <div class="scalebar"><span id="scaletxt">50 km</span><div class="bar" id="scalebar" style="width:80px"></div></div>
      </div>
    </div>

    <aside class="panel">
      <div class="pad searchrow">
        <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search places">
      </div>
      <div class="pad"><div class="chips" id="chips"></div></div>
      <div class="pad ringrow" id="ringrow"></div>
      <div class="list" id="list"></div>
      <div class="detail pad" id="detail"></div>
    </aside>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------- geography ---------------- */
var HUB={lat:28.6139,lon:77.2090};            /* Connaught Place, origin of the region sheet */
var AZ={lat:28.7110,lon:77.1780};             /* Azadpur Mandi, origin of the ring road sheet */
var R=6371.0088, D2R=Math.PI/180, CX=500, CY=500;
function dist(la,lo,O){O=O||HUB;
  var p1=O.lat*D2R,p2=la*D2R,dp=(la-O.lat)*D2R,dl=(lo-O.lon)*D2R;
  var h=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(h));}
function bear(la,lo,O){O=O||HUB;
  var p1=O.lat*D2R,p2=la*D2R,dl=(lo-O.lon)*D2R;
  var y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)/D2R+360)%360;}
var COMPASS=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function card(b){return COMPASS[Math.floor(((b+11.25)%360)/22.5)];}

/* azimuthal equidistant about Connaught Place: radial distance is true at any scale */
function proj(la,lo,S,O){var d=dist(la,lo,O),b=bear(la,lo,O)*D2R;
  return {x:CX+d*Math.sin(b)*S, y:CY-d*Math.cos(b)*S};}
function path(arr,S,O){return arr.map(function(c,i){var p=proj(c[0],c[1],S,O);
  return (i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1);}).join(" ");}

var S_R=440/200, S_D=440/38;    /* px per km in each view */

/* ---------------- categories ---------------- */
var CATS={
  ncr:{label:"NCR districts",color:"--c-ncr",shape:"sq"},
  town:{label:"Other cities & towns",color:"--c-town",shape:"ci"},
  node:{label:"On the ring roads",color:"--ringroad",shape:"sq"},
  hub:{label:"Landmarks & transport",color:"--c-ncr",shape:"di"},
  mandi:{label:"Mandis & depots",color:"--c-mandi",shape:"tr"},
  transit:{label:"Stations & ISBTs",color:"--c-transit",shape:"rc"},
  ev:{label:"EV charging",color:"--c-ev",shape:"pl"},
  area:{label:"Neighbourhoods",color:"--c-town",shape:"ci"},
  edge:{label:"NCR cities beyond",color:"--ink-3",shape:"ho"}
};
function glyph(cat){
  var c="var("+CATS[cat].color+")", st='stroke="var(--bg)" stroke-width="1.6"';
  var body={
    sq:'<rect x="1.5" y="1.5" width="8" height="8" fill="'+c+'" '+st+'/>',

function build(rows,S,bands,O){
  return rows.map(function(r,i){
    var d=dist(r[1],r[2],O), b=bear(r[1],r[2],O), p=proj(r[1],r[2],S,O), band=bands[bands.length-1][0];

            d:d,b:b,dir:card(b),x:p.x,y:p.y,band:band};

}

/* ---------------- base map ---------------- */
function el(tag,attrs,txt){var e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]); if(txt!=null) e.textContent=txt; return e;}
function rings(g,S,extent,list,major,bearingDeg,fmt){
  list.forEach(function(r){
    g.appendChild(el("circle",{cx:CX,cy:CY,r:r[0]*S,"class":"ring"+(r[0]===major?" major":r[1]?" faint":"")}));});
  for(var a=0;a<360;a+=45){var rad=a*D2R;
    g.appendChild(el("line",{x1:CX,y1:CY,x2:CX+Math.sin(rad)*extent*S,y2:CY-Math.cos(rad)*extent*S,"class":"spoke"}));}
  list.forEach(function(r){ if(r[1]) return;
    var rad=bearingDeg*D2R, x=CX+Math.sin(rad)*r[0]*S, y=CY-Math.cos(rad)*r[0]*S;
    g.appendChild(el("text",{x:x+4,y:y-3,"class":"ringlab"},fmt(r[0])));});
  [["N",0],["NE",45],["E",90],["SE",135],["S",180],["SW",225],["W",270],["NW",315]].forEach(function(c){
    var rad=c[1]*D2R, x=CX+Math.sin(rad)*(extent*1.055)*S, y=CY-Math.cos(rad)*(extent*1.055)*S;
    g.appendChild(el("text",{x:x,y:y+4,"class":"compass","text-anchor":"middle"},c[0]));});
}

function roadLabel(g,c,S,name,O,exp){
  var a=proj(c[c.length-2][0],c[c.length-2][1],S,O), b=proj(c[c.length-1][0],c[c.length-1][1],S,O);
  var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI, flip=(ang>90||ang<-90);
  if(flip) ang+=180;
  var x=b.x+(a.x-b.x)*0.03, y=b.y+(a.y-b.y)*0.03;
  g.appendChild(el("text",{x:x,y:y-4,"class":"roadlab"+(exp?" exp":""),"text-anchor":flip?"start":"end",
    transform:"rotate("+ang.toFixed(1)+" "+x+" "+y+")"},name));
}

/* ---------------- state ---------------- */
var MODE="region", V=VIEWS[MODE], nodes=NODES[MODE];
var k=1,tx=0,ty=0,sel=null,hover=null,labelsOn=true,focusOn=true;
var active={}, ringMax=200, query="";

function applyT(){zoomG.setAttribute("transform","translate("+tx+" "+ty+") scale("+k+")");place();}
function clamp(){var lim=520*(k-1)/k; if(lim<0)lim=0;
  tx=Math.max(-lim*k,Math.min(lim*k,tx)); ty=Math.max(-lim*k,Math.min(lim*k,ty));}

function place(){
  var m=zoomG.getScreenCTM(); if(!m) return;
  var cr=wrap.getBoundingClientRect();
  function P(x,y){return {x:m.a*x+m.c*y+m.e-cr.left, y:m.b*x+m.d*y+m.f-cr.top};}
  var h=P(CX,CY); hub.style.left=h.x+"px"; hub.style.top=h.y+"px";
  hub.classList.toggle("sm",k>2.2&&MODE!=="delhi");
  gRR.setAttribute("data-z",k<2.1?"far":"near");

  var boxes=[], dimRest = focusOn && MODE==="delhi";
  var vis=nodes.filter(function(n){return !n.b.classList.contains("dim");});
  function pri(p){return p.id===sel?0 : p.id===hover?1 : (dimRest&&p.focus?2:p.rank+3);}
  var ord=vis.slice().sort(function(a,b){return pri(a.p)-pri(b.p) || a.p.d-b.p.d;});

  nodes.forEach(function(n){
    var q=P(n.p.x,n.p.y);
    n.sx=q.x; n.sy=q.y;
    n.b.style.left=q.x+"px"; n.b.style.top=q.y+"px";
    n.b.classList.toggle("soft",dimRest&&!n.p.focus);
    n.b.classList.toggle("star",dimRest&&n.p.focus);
    n.on=q.x>-40&&q.x<cr.width+40&&q.y>-30&&q.y<cr.height+30;
    n.b.style.visibility=n.on?"visible":"hidden";
  });

  ord.forEach(function(n){
    var isHi=(n.p.id===sel||n.p.id===hover);
    var starred = dimRest && n.p.focus;
    n.l.className="lab"+(isHi?" hi":starred?" star":dimRest?" soft":"");
    if(!labelsOn&&!isHi){n.l.classList.add("dim");return;}
    if(!n.on){n.l.classList.add("dim");return;}
    var gate = k<1.3?2 : 3;
    if(!isHi && !starred && n.p.rank>gate){n.l.classList.add("dim");return;}
    var w=n.p.name.length*(starred?7.9:7.4)+11, hgt=18, off=starred?17:12;
    var x=n.sx+off, y=n.sy-9;
    var box={x:x,y:y,w:w,h:hgt}, ok=fits(box,boxes);
    if(!ok){box={x:n.sx-off-w,y:y,w:w,h:hgt}; ok=fits(box,boxes); if(ok)x=box.x;}
    if(!ok){box={x:n.sx-w/2,y:n.sy+off,w:w,h:hgt}; ok=fits(box,boxes); if(ok){x=box.x;y=box.y;}}
    if(!ok){box={x:n.sx-w/2,y:n.sy-off-hgt,w:w,h:hgt}; ok=fits(box,boxes); if(ok){x=box.x;y=box.y;}}
    if(!ok&&!isHi&&!starred){n.l.classList.add("dim");return;}
    boxes.push(box);
    n.l.style.left=x+"px"; n.l.style.top=y+"px";
  });

  function fits(b,list){
    if(b.x<2||b.y<2||b.x+b.w>cr.width-2||b.y+b.h>cr.height-2) return false;
    var pad = MODE==="delhi"?34:48;
    if(Math.abs(b.x+b.w/2-h.x)<pad&&Math.abs(b.y+b.h/2-h.y)<26) return false;
    for(var i=0;i<list.length;i++){var o=list[i];
      if(b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y) return false;}
    return true;
  }

  var pxPerKm=Math.abs(m.a)*V.S, want=[1,2,5,10,25,50,100,200], pick=want[0];
  for(var i=0;i<want.length;i++){ if(want[i]*pxPerKm<=120) pick=want[i]; }
  document.getElementById("scaletxt").textContent=pick+" km";
  document.getElementById("scalebar").style.width=Math.round(pick*pxPerKm)+"px";
}

/* pan + zoom */
var drag=null;
wrap.addEventListener("pointerdown",function(e){
  if(e.target.closest(".chrome")) return;
  drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty,moved:0};
  wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener("pointermove",function(e){
  if(!drag) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
  var cr=wrap.getBoundingClientRect(), s=Math.min(cr.width,cr.height)/1000;
  tx=drag.tx+dx/s; ty=drag.ty+dy/s; clamp(); applyT();});
["pointerup","pointercancel"].forEach(function(ev){wrap.addEventListener(ev,function(e){
  if(drag&&drag.moved<4&&!e.target.closest(".mk")&&!e.target.closest(".hub")) select(null);
  drag=null; wrap.classList.remove("drag");});});
wrap.addEventListener("wheel",function(e){
  e.preventDefault();
  var cr=wrap.getBoundingClientRect(), s=Math.min(cr.width,cr.height)/1000;
  var mx=(e.clientX-cr.left-(cr.width-1000*s)/2)/s, my=(e.clientY-cr.top-(cr.height-1000*s)/2)/s;
  var nk=Math.max(1,Math.min(7,k*(e.deltaY<0?1.14:1/1.14)));
  tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; clamp(); applyT();
},{passive:false});
function zoomBy(f){var nk=Math.max(1,Math.min(7,k*f));
  tx=500-(500-tx)*(nk/k); ty=500-(500-ty)*(nk/k); k=nk; clamp(); applyT();}
document.getElementById("zin").onclick=function(){zoomBy(1.4);};
document.getElementById("zout").onclick=function(){zoomBy(1/1.4);};
document.getElementById("zreset").onclick=function(){k=1;tx=0;ty=0;applyT();};

var pts={}, pinch=null;
wrap.addEventListener("pointerdown",function(e){pts[e.pointerId]=e;});
wrap.addEventListener("pointermove",function(e){
  if(!(e.pointerId in pts)) return; pts[e.pointerId]=e;
  var ids=Object.keys(pts); if(ids.length!==2) return;
  var a=pts[ids[0]],b=pts[ids[1]], d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  if(pinch){ zoomBy(d/pinch); } pinch=d; drag=null;});
["pointerup","pointercancel"].forEach(function(ev){wrap.addEventListener(ev,function(e){delete pts[e.pointerId];pinch=null;});});

function match(p){
  if(!active[p.cat]) return false;
  if(p.d>ringMax+1) return false;
  if(query){
    var hay=(p.name+" "+p.meta+" "+CATS[p.cat].label+" "+p.note).toLowerCase();
    if(hay.indexOf(query)<0) return false;
  }
  return true;
}

function render(){
  var vis=V.places.filter(match);
  nodes.forEach(function(n){n.b.classList.toggle("dim",!match(n.p));});
  list.innerHTML="";
  if(!vis.length){list.innerHTML='<div class="empty">Nothing matches that. Try clearing the search or widening the ring.</div>';place();return;}
  V.bands.forEach(function(bd){
    var grp=vis.filter(function(p){return p.band===bd[0];});
    if(!grp.length) return;
    var h=document.createElement("div"); h.className="grp"; h.textContent=bd[1]+"  ·  "+grp.length; list.appendChild(h);
    grp.forEach(function(p){
      var r=document.createElement("button");
      r.className="row"+(sel===p.id?" sel":""); r.type="button"; r.dataset.id=p.id;
      r.innerHTML=glyph(p.cat).replace('class="glyph"','width="14" height="14"')+
        '<span class="nm">'+p.name+(p.meta?'<small>'+p.meta+'</small>':'')+'</span>'+
        '<span class="km"><b>'+p.d.toFixed(V.dec)+'</b> km '+p.dir+'</span>';
      r.onclick=function(){select(p.id);};
      list.appendChild(r);
    });
  });
  place();
}

/* ---------------- selection ---------------- */
var gSel=document.getElementById("g-sel"), detail=document.getElementById("detail");
hub.addEventListener("click",function(e){e.stopPropagation();select("hub");});

function select(id){
  sel=id;
  gSel.innerHTML="";
  nodes.forEach(function(n){n.b.classList.toggle("sel",n.p.id===id);});
  [].forEach.call(list.querySelectorAll(".row"),function(r){r.classList.toggle("sel",+r.dataset.id===id);});

  if(id===null){ detail.innerHTML=intro(); place(); return; }
  if(id==="hub"){
    detail.innerHTML = MODE==="delhi"
      ? '<div class="kicker">Vantage point'+closeBtn()+'</div><h2>Azadpur Mandi</h2>'+
        '<p>Asia\'s largest wholesale fruit and vegetable market, sitting on the Ring Road at its northern corner. Prices set here move through the whole region.</p>'+
        '<p>This sheet is drawn outward from the mandi. Every ring and every distance in the list is measured from this point, in a straight line. Road distance runs roughly 15 to 30 per cent longer.</p>'
      : '<div class="kicker">The centre'+closeBtn()+'</div><h2>Connaught Place</h2>'+
        '<p>Distances on the region sheet are measured from here in a straight line. Road distance runs roughly 15 to 30 per cent longer.</p>'+
        '<p>Four loops surround the city. The Ring Road sits about 5 km out, the Outer Ring Road 8 to 12 km, UER-II runs wide to the west, and the Western and Eastern Peripheral expressways close a fourth ring at 50 to 60 km.</p>';
    bindClose(); place(); return;
  }

  var p=null; for(var i=0;i<V.places.length;i++){ if(V.places[i].id===id){p=V.places[i];break;} }
  if(!p) return;
  gSel.appendChild(el("line",{x1:CX,y1:CY,x2:p.x,y2:p.y,"class":"hairline"}));
  gSel.appendChild(el("circle",{cx:p.x,cy:p.y,r:9,fill:"none",stroke:"var(--accent)","stroke-width":1.3,"stroke-opacity":.85}));

  var third = MODE==="delhi"
    ? '<div class="fact"><dt>On</dt><dd class="'+(p.meta?"ring":"")+'">'+(p.meta||"Off the loops")+'</dd></div>'
    : '<div class="fact"><dt>State</dt><dd>'+p.meta+'</dd></div>';
  detail.innerHTML=
    '<div class="kicker">'+CATS[p.cat].label+closeBtn()+'</div>'+
    '<h2>'+p.name+'</h2>'+
    '<dl class="facts">'+
      '<div class="fact"><dt>'+V.originShort+'</dt><dd>'+p.d.toFixed(V.dec)+' km</dd></div>'+
      '<div class="fact"><dt>Direction</dt><dd>'+p.dir+' · '+p.b.toFixed(0)+'°</dd></div>'+
      third+
      '<div class="fact"><dt>Position</dt><dd>'+p.lat.toFixed(3)+', '+p.lon.toFixed(3)+'</dd></div>'+
    '</dl><p>'+p.note+'</p>';
  bindClose();
  place();
  var n=null; for(var j=0;j<nodes.length;j++){ if(nodes[j].p.id===id){n=nodes[j];break;} }
  if(n&&!n.on){ tx=(500-p.x*k); ty=(500-p.y*k); clamp(); applyT(); }
}
function closeBtn(){return '<button class="closebtn" id="dclose">Clear</button>';}
function bindClose(){var b=document.getElementById("dclose"); if(b) b.onclick=function(){select(null);};}
function intro(){
  if(MODE==="delhi"){
    var onring=V.places.filter(function(p){return p.cat==="node";}).length;
    return '<div class="kicker">Ring road sheet</div>'+
      '<h2>Drawn outward from Azadpur Mandi</h2>'+
      '<p>The mandi is the vantage point at the centre, marked by the green diamond. Rings run every 5 km from it, and all '+onring+' ring road junctions, plus every neighbourhood and market, are measured from there.</p>'+
      '<p>Azadpur sits on the inner Ring Road, so that loop runs through the centre of the sheet rather than around it. The Outer Ring Road sits wider, and UER-II, dashed, is the newer western arc from Alipur down to Dwarka.</p>'+
      '<p>Red squares are junctions on the loops. Green triangles are mandis and depots. Purple rectangles are railway stations and ISBTs, and teal crosses are EV charging points. Diamonds are landmarks, circles are neighbourhoods, and dashed circles are the NCR cities at the rim.</p>'+
      '<p>The green bands are the routes light commercial vehicles take into the city, arrowed in the direction of travel: off the Dehradun expressway through CRP Camp, Khajuri and Bhajanpura to Akshardham; off the Gurgaon expressway to Dhaula Kuan; and off the Dwarka expressway along Najafgarh Road and Alipur Road.</p>'+
      '<p>The white lines are the highways and expressways out of the city. NH-9 runs straight through, entering from Rohtak in the west and leaving east past Ghazipur towards Hapur. The yellow lines are expressways: Dehradun and Meerut from Akshardham, Gurgaon from Dhaula Kuan, and Dwarka from Shiv Murti.</p>'+
      '<div class="hint">Alignments are schematic, not surveyed. Switch to Region for the 200 km sheet.</div>';
  }
  var ncr=V.places.filter(function(p){return p.cat==="ncr";}).length;
  return '<div class="kicker">Region sheet</div>'+
   '<h2>'+V.places.length+' places, '+ncr+' of them NCR districts</h2>'+
   '<p>Rings are drawn every 50 km from Connaught Place. The projection is azimuthal equidistant, so the distance from Delhi to any marker is true to scale along the line between them.</p>'+
   '<p>Squares are NCR district headquarters, circles are everything else. Scroll to zoom, drag to pan.</p>'+
   '<div class="hint">Switch to Ring roads for a magnified sheet of the city itself.</div>';
}

/* ---------------- view switch ---------------- */
function setMode(v){
  if(v===MODE) return;
  MODE=v; V=VIEWS[v];
  document.getElementById("v-region").classList.toggle("view-off",v!=="region");
  document.getElementById("v-delhi").classList.toggle("view-off",v!=="delhi");
  [].forEach.call(document.querySelectorAll("#seg button"),function(b){b.classList.toggle("on",b.dataset.v===v);});
  NODES[v==="region"?"delhi":"region"].forEach(function(n){n.b.classList.add("hide");n.l.classList.add("dim");});
  nodes=NODES[v];
  nodes.forEach(function(n){n.b.classList.remove("hide");});
  active={}; V.cats.forEach(function(c){active[c]=true;});
  ringMax=V.max; query=""; document.getElementById("q").value="";
  sel=null; k=1; tx=0; ty=0;
  buildControls(); render(); select(null); applyT();
}
[].forEach.call(document.querySelectorAll("#seg button"),function(b){
  b.onclick=function(){setMode(b.dataset.v);};});

/* theme */
document.getElementById("theme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
};

/* go */
V.cats.forEach(function(c){active[c]=true;});
nodes.forEach(function(n){n.b.classList.remove("hide");});
buildControls(); render(); select(null); applyT();
addEventListener("resize",place);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(place);
setTimeout(place,180);
})();
</script>
</body>
</html>
